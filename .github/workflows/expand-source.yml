name: Expand complete source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/expand-source.yml

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore the complete React project
        run: |
          mv index.html demo.html
          base64 --decode .github/source.tar.gz.b64 > /tmp/imprint-source.tar.gz
          tar -xzf /tmp/imprint-source.tar.gz
          rm .github/source.tar.gz.b64
          rm .github/workflows/expand-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete React application source"
          git push
