name: Clean macOS metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-metadata.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary metadata
        run: |
          find . -name '._*' -delete
          rm .github/workflows/cleanup-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary macOS metadata"
          git push
