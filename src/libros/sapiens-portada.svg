<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <!-- El perfil, mirando a la derecha: cráneo redondo, frente, nariz, labio,
         barbilla y cuello hasta el filo de abajo. Sin la nariz y la barbilla
         la silueta se lee como un huevo y no como una cabeza. Todo lo demás
         va recortado por aquí: tres franjas de tiempo dentro de un cráneo. -->
    <clipPath id="cabeza">
      <path d="M198 168
               C148 168 108 210 106 266
               C105 300 104 330 104 356
               L104 552 L238 552 L238 500
               C238 484 246 476 260 473
               C272 470 276 461 271 452
               L259 428
               C256 422 258 417 265 416
               L284 412
               C293 410 295 402 290 395
               L276 358
               C269 246 252 168 198 168 z" />
    </clipPath>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2c3d" />
      <stop offset="1" stop-color="#164058" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="#d9481f" />

  <g fill="#f4ece0" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif"
     font-weight="800" text-anchor="middle">
    <text x="200" y="62" font-size="52" letter-spacing="1">HOMO</text>
    <text x="200" y="122" font-size="52" letter-spacing="1">SAPIENS</text>
  </g>
  <text x="200" y="156" fill="#12303f" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="17" text-anchor="middle">Una breve historia de la humanidad</text>

  <g clip-path="url(#cabeza)">

    <!-- 1. La ciudad, de noche: de 164 a 330 -->
    <rect x="80" y="164" width="300" height="166" fill="url(#cielo)" />
    <g fill="#f4ece0">
      <circle cx="126" cy="232" r="2.4" /><circle cx="166" cy="219" r="2" />
      <circle cx="208" cy="227" r="2.6" /><circle cx="248" cy="214" r="2" />
      <circle cx="286" cy="231" r="2.4" /><circle cx="146" cy="255" r="1.6" />
      <circle cx="266" cy="252" r="1.6" />
    </g>
    <path d="M126 232 L166 219 L208 227 L248 214 L286 231"
          stroke="#f4ece0" stroke-width="1.1" fill="none" opacity="0.85" />
    <path d="M292 200 l3.4 7 7.6 1.1 -5.5 5.4 1.3 7.6 -6.8 -3.6 -6.8 3.6 1.3 -7.6 -5.5 -5.4 7.6 -1.1 z"
          fill="#e8a93c" />
    <g fill="#2e7d8a">
      <rect x="102" y="284" width="26" height="46" />
      <rect x="134" y="268" width="20" height="62" />
      <rect x="160" y="290" width="30" height="40" />
      <rect x="196" y="260" width="24" height="70" />
      <rect x="226" y="278" width="18" height="52" />
      <rect x="250" y="266" width="26" height="64" />
      <rect x="282" y="288" width="22" height="42" />
    </g>
    <g fill="#bfe3e6" opacity="0.9">
      <rect x="138" y="276" width="4" height="8" /><rect x="146" y="276" width="4" height="8" />
      <rect x="202" y="270" width="4" height="9" /><rect x="210" y="270" width="4" height="9" />
      <rect x="256" y="276" width="4" height="9" /><rect x="264" y="276" width="4" height="9" />
      <rect x="138" y="296" width="4" height="8" /><rect x="202" y="292" width="4" height="9" />
      <rect x="256" y="298" width="4" height="9" />
    </g>

    <!-- 2. El campo y la aldea: de 330 a 448 -->
    <rect x="80" y="330" width="300" height="118" fill="#e8a93c" />
    <path d="M80 348 q70 -14 140 2 q80 18 160 -4 v16 q-80 20 -160 2 q-70 -16 -140 -2 z" fill="#d99327" />
    <g fill="#f2e3c6">
      <rect x="182" y="360" width="34" height="30" />
      <rect x="220" y="368" width="26" height="22" />
      <rect x="156" y="370" width="22" height="20" />
    </g>
    <g fill="#12303f">
      <rect x="192" y="374" width="7" height="16" />
      <rect x="228" y="378" width="6" height="12" />
      <rect x="164" y="378" width="6" height="12" />
    </g>
    <g fill="#2f5d3a">
      <path d="M132 390 q6 -30 12 0 z" /><path d="M146 390 q5 -24 10 0 z" />
      <circle cx="276" cy="372" r="15" /><rect x="273" y="380" width="6" height="12" />
    </g>
    <g stroke="#c07d1c" stroke-width="2.4" fill="none">
      <path d="M98 448 v-38" /><path d="M126 448 v-42" /><path d="M154 448 v-37" />
      <path d="M182 448 v-41" /><path d="M210 448 v-36" /><path d="M238 448 v-40" />
      <path d="M266 448 v-37" /><path d="M294 448 v-41" />
    </g>
    <g fill="#c07d1c">
      <ellipse cx="98" cy="406" rx="5" ry="9" /><ellipse cx="126" cy="402" rx="5" ry="9" />
      <ellipse cx="154" cy="407" rx="5" ry="9" /><ellipse cx="182" cy="403" rx="5" ry="9" />
      <ellipse cx="210" cy="408" rx="5" ry="9" /><ellipse cx="238" cy="404" rx="5" ry="9" />
      <ellipse cx="266" cy="407" rx="5" ry="9" /><ellipse cx="294" cy="403" rx="5" ry="9" />
    </g>

    <!-- 3. La cueva: de 448 abajo -->
    <rect x="80" y="448" width="300" height="120" fill="#12303f" />
    <g fill="#d9481f">
      <ellipse cx="146" cy="508" rx="21" ry="23" />
      <rect x="131" y="474" width="7" height="30" rx="3.5" />
      <rect x="141" y="468" width="7" height="36" rx="3.5" />
      <rect x="151" y="470" width="7" height="34" rx="3.5" />
      <rect x="161" y="478" width="7" height="26" rx="3.5" />
      <rect x="166" y="496" width="16" height="7" rx="3.5" transform="rotate(28 174 499)" />
    </g>
    <path d="M206 486 l26 -8 16 24 -10 30 -26 4 -12 -24 z" fill="#dcd3c2" />
    <path d="M206 486 l26 -8 4 24 -18 22 -12 -24 z" fill="#c9bfa9" />
    <g fill="#2b4d5e">
      <circle cx="190" cy="540" r="6" /><circle cx="258" cy="534" r="7" /><circle cx="118" cy="542" r="5" />
    </g>
  </g>

  <text x="200" y="576" fill="#f4ece0" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="25" letter-spacing="1.5" text-anchor="middle">YUVAL NOAH HARARI</text>
</svg>
